<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hCaptcha Login Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://js.hcaptcha.com/1/api.js?render=explicit&onload=onHcaptchaApiLoad" async defer></script>
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <div id="captcha"></div>

      <button type="submit" id="submit-btn">Log in</button>
      <p id="feedback" role="status" aria-live="polite"></p>
    </form>
    <p class="hint">Use <code>admin@demo.com</code> / <code>Password123!</code> to simulate a valid login.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
